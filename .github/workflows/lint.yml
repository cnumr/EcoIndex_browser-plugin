name: "Lint Firefox web extension"
on:
  pull_request:

jobs:
  lint:
    name: "✅ Linter"
    runs-on: ubuntu-latest
    steps:
      - name: "🚀 Checkout code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: "👷 Install dependencies"
        run: npm install

      - name: "🚨 Lint source code and web-extension"
        run: npm run lint
